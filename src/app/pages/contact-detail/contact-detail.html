<main class="contact-detail">
    @if (contacto) {
        <h1>{{ contacto.firstName }} {{ contacto.lastName }}</h1>
        <p>Teléfono: {{ contacto.number }}</p>
        <p>Email: {{ contacto.email }}</p>

        <a routerLink="/contacts">Volver a la lista de contactos</a>

    } @else {
        <p>Contacto no encontrado.</p>
    }
</main>
